name: Update Prev release hashes

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  update-hashes:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'renovate/prev-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Renovate branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update Prev hashes
        run: |
          git fetch origin main
          git show origin/main:scripts/update-prev-hashes.sh > "$RUNNER_TEMP/update-prev-hashes.sh"
          chmod +x "$RUNNER_TEMP/update-prev-hashes.sh"
          "$RUNNER_TEMP/update-prev-hashes.sh"

      - name: Commit updated hashes
        run: |
          if git diff --quiet -- nix/pkgs/prev/default.nix; then
            echo "Prev hashes are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/pkgs/prev/default.nix
          git commit -m "chore(deps): update Prev release hashes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
