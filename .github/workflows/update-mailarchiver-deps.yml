name: Update MailArchiver dependencies

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  update-dependencies:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'renovate/s1t5-mail-archiver-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Renovate branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update MailArchiver dependencies
        run: |
          git fetch origin main
          git show origin/main:scripts/update-mailarchiver-deps.sh > "$RUNNER_TEMP/update-mailarchiver-deps.sh"
          chmod +x "$RUNNER_TEMP/update-mailarchiver-deps.sh"
          "$RUNNER_TEMP/update-mailarchiver-deps.sh"

      - name: Commit updated dependencies
        run: |
          if git diff --quiet -- nix/pkgs/mailarchiver/default.nix nix/pkgs/mailarchiver/deps.json; then
            echo "MailArchiver dependencies are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/pkgs/mailarchiver/default.nix nix/pkgs/mailarchiver/deps.json
          git commit -m "chore(deps): update MailArchiver dependencies"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
